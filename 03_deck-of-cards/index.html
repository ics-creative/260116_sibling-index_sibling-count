<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>03_deck-of-cards</title>

    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <ul>
        <li>
          <span class="card-label">1</span>
          <button class="card-remove" type="button">
            ×
          </button>
        </li>
        <li>
          <span class="card-label">2</span>
          <button class="card-remove" type="button">
            ×
          </button>
        </li>
        <li>
          <span class="card-label">3</span>
          <button class="card-remove" type="button">
            ×
          </button>
        </li>
        <li>
          <span class="card-label">4</span>
          <button class="card-remove" type="button">
            ×
          </button>
        </li>
        <li>
          <span class="card-label">5</span>
          <button class="card-remove" type="button">
            ×
          </button>
        </li>
        <li>
          <span class="card-label">6</span>
          <button class="card-remove" type="button">
            ×
          </button>
        </li>
        <li>
          <span class="card-label">7</span>
          <button class="card-remove" type="button">
            ×
          </button>
        </li>
      </ul>
    </div>

    <!-- 削除ボタンを押下したらカード削除 -->
    <script>
      const buttons = document.querySelectorAll(".card-remove");
      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          const item = button.closest("li");
          if (item) item.remove();
        });
      });
    </script>
  </body>
</html>
