<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>04_deck-of-cards</title>

    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <ul class="hand" aria-label="Playing cards">
        <li class="slot">
          <div class="card">
            <span class="face front"> A </span>
          </div>
        </li>

        <li class="slot">
          <div class="card">
            <span class="face front"> B </span>
          </div>
        </li>

        <li class="slot">
          <div class="card">
            <span class="face front"> C </span>
          </div>
        </li>

        <li class="slot">
          <div class="card">
            <span class="face front"> D </span>
          </div>
        </li>

        <li class="slot">
          <div class="card">
            <span class="face front"> E </span>
          </div>
        </li>

        <li class="slot">
          <div class="card">
            <span class="face front"> F </span>
          </div>
        </li>

        <li class="slot">
          <div class="card">
            <span class="face front"> G </span>
          </div>
        </li>
      </ul>
    </div>
  </body>
</html>
