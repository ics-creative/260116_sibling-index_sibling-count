<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01_staggered-animation</title>

    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container">
      <button class="replay-button" type="button">
        スタッガーアニメーションを再生
      </button>
      
      <ul class="cards">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
      </ul>
    </main>


    <script>
      const list = document.querySelector(".cards");
      const replayButton = document.querySelector(".replay-button");

      const replayAnimation = () => {
        list.classList.add("is-reset");
        list.getBoundingClientRect();
        requestAnimationFrame(() => {
          list.classList.remove("is-reset");
        });
      };

      window.addEventListener("load", replayAnimation);
      replayButton.addEventListener("click", replayAnimation);
    </script>
  </body>
</html>
