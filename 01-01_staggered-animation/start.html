<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01_staggered-animation</title>

    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="./style.css" />
    <style>
      body {
        padding: 0;
      }
      .start-page {
        display: flex;
        height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        text-align: center;
      }
      .start-button {
        display: inline-flex;
        justify-content: center;
        padding: 12px 24px;
        border-radius: 999px;
        border: none;
        background: #7cc6e4;
        color: #fff;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
        transition: background-color 0.3s, box-shadow 0.3s;

        &:hover {
          box-shadow: none;
          background: #57b4da;
        }
      }
    </style>
  </head>
  <body>
    <main class="start-page">
      <a class="start-button" href="./index.html"
        >スタッガーアニメーションのデモページへ移動</a
      >
    </main>
  </body>
</html>
